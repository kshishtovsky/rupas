plugins {
    id 'com.android.application'
}

// Single source of truth for the version: <repo>/VERSION (see docs/PRD_RELEASE_PIPELINE.md).
// versionCode must stay monotonic, so it is derived: major*10000 + minor*100 + patch.
def appVersion = rootProject.file('../VERSION').text.trim()
def (vMajor, vMinor, vPatch) = appVersion.tokenize('.').collect { it as int }

// Release signing key is never in git: keystore.properties is local-only,
// CI writes it from the KEYSTORE_BASE64 / KEYSTORE_PASSWORD secrets.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'ru.rupas.android'
    compileSdk 36

    defaultConfig {
        applicationId "ru.rupas.android"
        minSdk 26
        targetSdk 36
        versionCode vMajor * 10000 + vMinor * 100 + vPatch
        versionName appVersion
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file('keystore/' + (keystoreProps['storeFile'] ?: 'rupas-release.jks'))
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias'] ?: 'rupas'
                keyPassword keystoreProps['keyPassword'] ?: keystoreProps['storePassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            // Друзьям хватает arm64; остальные ABI только распухают APK
            ndk {
                abiFilters 'arm64-v8a'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        // Нужен BuildConfig.VERSION_NAME: на нём сравниваются версии в UpdateChecker.
        // AGP 8 генерирует его только по явному флагу.
        buildConfig true
    }
}

dependencies {
    implementation files('libs/rupas-core.aar')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    // W3: EncryptedSharedPreferences для настроек эндпоинта (секреты не в plain prefs)
    implementation 'androidx.security:security-crypto:1.1.0'
    // T3: список правил по стадиям + drag-reorder внутри стадии (ItemTouchHelper).
    // Версия — та, что уже приходит транзитивно из material 1.12.0, поэтому сборка офлайн.
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
}
