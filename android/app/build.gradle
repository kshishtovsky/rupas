plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.rupas.android'
    compileSdk 36

    defaultConfig {
        applicationId "ru.rupas.android"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "0.1.0-w2"
    }

    signingConfigs {
        release {
            storeFile file("$rootDir/keystore/rupas-release.jks")
            storePassword 'rupas-release-2026'
            keyAlias 'rupas'
            keyPassword 'rupas-release-2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            // Друзьям хватает arm64; остальные ABI только распухают APK
            ndk {
                abiFilters 'arm64-v8a'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation files('libs/rupas-core.aar')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    // W3: EncryptedSharedPreferences для настроек эндпоинта (секреты не в plain prefs)
    implementation 'androidx.security:security-crypto:1.1.0'
}
