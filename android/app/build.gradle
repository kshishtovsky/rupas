plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.rupas.android'
    compileSdk 36

    defaultConfig {
        applicationId "ru.rupas.android"
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName "0.2.0"
    }

    signingConfigs {
        release {
            storeFile file("$rootDir/keystore/rupas-release.jks")
            storePassword 'rupas-release-2026'
            keyAlias 'rupas'
            keyPassword 'rupas-release-2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            // Друзьям хватает arm64; остальные ABI только распухают APK
            ndk {
                abiFilters 'arm64-v8a'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation files('libs/rupas-core.aar')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    // W3: EncryptedSharedPreferences для настроек эндпоинта (секреты не в plain prefs)
    implementation 'androidx.security:security-crypto:1.1.0'
    // T3: список правил по стадиям + drag-reorder внутри стадии (ItemTouchHelper).
    // Версия — та, что уже приходит транзитивно из material 1.12.0, поэтому сборка офлайн.
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
}
