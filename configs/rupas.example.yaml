# Rupas example configuration (copy to config.yaml next to rupasd).
# Unknown fields are rejected; see internal/config/config.go for the schema
# and docs/SYSTEM_DESIGN.md §4.2-4.3, §5, §6 for the semantics.
profile: isp-home-2025-10-25

rules:
  # Resolution order is fixed: cidr → sni → ports → default (§4.2).
  - sni: www.youtube.com      # SNI-blackholed by the TSPU
    action: desync
  - sni: "*.googlevideo.com"
    action: desync
  - sni: discord.com
    action: desync
  - sni: gateway.discord.gg
    action: desync
  - cidr: 149.154.160.0/20    # Telegram: IP-blackholed → tunnel (§3.3)
    action: tunnel
  - cidr: 91.108.0.0/16
    action: tunnel
  - cidr: 95.161.76.100/32
    action: tunnel
  - ports: 50000-65535        # Discord voice UDP is dead → tunnel (XUDP)
    action: tunnel
  - action: direct            # default rule (at most one)

desync:
  strategy: fake
  fake_template: chrome-124-pq.bin
  ttl: 13                     # calibrated by the prober (§7.2)
  ttl_margin: 2
  repeats: 6

# ---------------------------------------------------------------------------
# Tunnel plan (§6, wave 5): TCP streams (Telegram) ride `tcp`, UDP
# pseudo-sessions (Discord voice) ride `udp`, and `fallback` is the backup
# TCP path tried when the primary TCP dial fails. UDP falls back to XUDP
# over the TCP endpoint after 3 failed STUN probes (stun.cloudflare.com).
#
# kinds:
#   vless_tcp     — VLESS over TCP+TLS (uuid, sni, alpn, fingerprint; no flow
#                   unless you set one — plain links have none)
#   vless_xhttp   — VLESS over XHTTP (path, mode packet-up|stream-up|
#                   stream-one, x_padding_bytes "min-max")
#   vless_reality — VLESS+Reality (reality_public_key[, reality_short_id])
#   hysteria2     — Hysteria2 over QUIC (password, alpn [h3])
#
# BEHAVIOUR WHILE EMPTY (the default below): the tunnel branch is DISABLED
# and every TUNNEL rule is escalated with an honest log line and a counter
# visible in `rupasctl status` (tunnel mode: escalated):
#   - sni rules       → action desync  (the DESYNC fallback)
#   - cidr/port rules → action direct  (an IP-blackholed CIDR will not
#                       pass, but flows are never silently black-holed at
#                       a dead loopback port either)
# Fill every field of each endpoint you use — partial endpoints fail
# validation. A legacy single-endpoint `tunnel:` section (wave ≤4,
# vless+reality) is still accepted and migrated automatically.
#
# While a live tunnel runs but its health marker fails 3×30 s, TG flows
# are HELD (dropped with a counter), NOT escalated to direct — the TSPU
# blackholes those CIDRs; recovery resumes the relay automatically.
#
# Example (three endpoints on one VPS):
#
# tunnels:
#   tcp:
#     kind: vless_tcp
#     host: 203.0.113.10          # VPS host or IP
#     port: 12341
#     uuid: 0f4e1c2d-...          # VLESS user UUID
#     sni: vps.example.net
#     alpn: [h2, http/1.1]
#     fingerprint: chrome         # uTLS client fingerprint
#     # mux: on                   # sing-mux (one long-lived TLS connection).
#                                 # Opt-in: needs a sing-box SERVER; xray
#                                 # does not demux sing-mux (live-verified
#                                 # wave 6 — every stream dies with EOF).
#                                 # mux_padding: true adds anti-length
#                                 # padding when the server supports it.
#   udp:
#     kind: hysteria2
#     host: 203.0.113.10
#     port: 53552                 # UDP
#     password: "hy2-secret"
#     sni: vps.example.net
#     alpn: [h3]
#     # NOTE (wave 6): when the TCP fallback below is absent or is
#     # vless_xhttp, this hysteria2 endpoint AUTOMATICALLY doubles as the
#     # TCP fallback carrier (hy2 carries TCP streams). Live-verified:
#     # TG-DC TCP through hy2 answers in ~120-160 ms, and CIDR-rule
#     # destinations dial the fallback FIRST (relaying them through
#     # vless_tcp triggers a ~5-min TSPU quarantine of the primary).
#   fallback:
#     kind: vless_xhttp
#     host: 203.0.113.10
#     port: 4443
#     uuid: 0f4e1c2d-...
#     sni: vps.example.net
#     path: /xhttp-path
#     mode: packet-up
#     x_padding_bytes: 100-1000
#     # vless_xhttp is NOT part of the automatic dial chain anymore
#     # (default chain: tcp → hysteria2-tcp). On TSPU networks the XHTTP
#     # port is commonly blackholed outright (live finding F3: ClientHello
#     # to :4443 dropped, i/o timeout on the VPS side) and a dead fallback
#     # adds a full dial-timeout penalty to every dial. Set the flag below
#     # to put it back in the chain explicitly:
#     # (top level, next to `tunnels:`) xhttp_fallback_in_chain: true
# ---------------------------------------------------------------------------
tunnels: {}

exclusions:
  cidrs: []                   # always-DIRECT destinations (the VPS itself
  domains: []                 # belongs here in production)
